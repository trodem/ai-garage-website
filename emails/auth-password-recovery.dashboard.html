<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Passwort zurücksetzen — GarIQ</title>
  </head>
  <body style="background-color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Ubuntu,sans-serif;margin:0;padding:24px;">
    <div style="margin:0 auto;padding:32px 24px;max-width:560px;background-color:#ffffff;border-radius:8px;">
      <h1 style="font-size:22px;font-weight:700;color:#0f172a;margin:0 0 24px;">GarIQ</h1>
      <p style="font-size:16px;line-height:24px;color:#18181b;margin:0 0 12px;">Hallo,</p>
      <p style="font-size:15px;line-height:24px;color:#3f3f46;margin:0 0 16px;">
        Wir haben eine Anfrage erhalten, das Passwort für dein GarIQ-Konto zurückzusetzen.
        Tippe auf den Button, um ein neues Passwort zu wählen.
      </p>
      <p style="text-align:center;margin:24px 0;">
        <!-- REQUIRED: keep ConfirmationURL — do not replace with SiteURL -->
        <a href="{{ .ConfirmationURL }}" style="background-color:#0284c7;border-radius:9999px;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;padding:12px 24px;display:inline-block;">
          Passwort zurücksetzen
        </a>
      </p>
      <p style="font-size:13px;line-height:20px;color:#71717a;margin:0;">
        Wenn du diese Anfrage nicht gestellt hast, kannst du diese E-Mail ignorieren.
      </p>
      <hr style="border:none;border-top:1px solid #e4e4e7;margin:32px 0 16px;" />
      <p style="font-size:12px;color:#71717a;line-height:20px;margin:0;">
        <a href="https://gariq.app/de" style="color:#52525b;text-decoration:underline;">GarIQ</a>
      </p>
    </div>
  </body>
</html>
